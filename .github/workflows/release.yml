on:
  push:
    branches:
      - master
    # The manifest commit this workflow pushes must not retrigger it, and a
    # docs-only change has no business re-creating the snapshot release.
    paths-ignore:
      - manifest.json
      - README.md
      - AGENTS.md
      - CLAUDE.md

name: Create release

jobs:
  build:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # Nothing gets zipped or released out of a tree that would not install:
      # this repo has no build step, so a file that a browser cannot create,
      # or one over raw's 100 MB limit, is invisible until it reaches a
      # player. See scripts/check-contract.mjs and AGENTS.md.
      - name: Check the install contract
        run: node scripts/check-contract.mjs
      # manifest.json lists every distribution file with its size and sha256.
      # The nQuake web installer (nQuake/nquake-reborn) reads it and fetches
      # the files one by one from raw.githubusercontent.com, because release
      # assets can't be fetched from a browser (no CORS headers). Regenerate
      # and commit it whenever the files change.
      - name: Update manifest.json
        run: |
          node scripts/build-manifest.mjs
          if ! git diff --quiet -- manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "chore: update manifest.json"
            git push
          fi
      - name: Create archives
        run: |
          find . -maxdepth 1 -type d ! -iname ".*" -print0|xargs -0 -I% -P$(nproc) bash -c 'cd % && zip -q -9 -r ../%.zip * && echo "% complete."'
          ls *.zip||exit 1
      - name: Remove tag and release
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          delete_release: true
          tag_name: snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag as snapshot
        uses: rickstaa/action-create-tag@v1
        id: "tag_create"
        with:
          tag: "snapshot"
          tag_exists_error: false
          message: "Latest release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: ./*.zip
          tag: snapshot
          overwrite: true
          promote: true
          body: "nQuake asset release."
